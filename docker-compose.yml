services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      JOB_DB_PATH: /app/artifacts/jobs.sqlite3
      WORKER_ID: api-worker-disabled
    volumes:
      - ./artifacts:/app/artifacts
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file:
      - .env
    environment:
      JOB_DB_PATH: /app/artifacts/jobs.sqlite3
      WORKER_ID: worker-1
    volumes:
      - ./artifacts:/app/artifacts
    command: python worker.py
    depends_on:
      - api
