name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install pip-audit

      # ChromaDB is a transitive CrewAI dependency. As of October 2026,
      # the latest available ChromaDB release is flagged by these advisories
      # and no fixed release is available. Keep the exceptions explicit and
      # revisit them when an upstream fix ships.
      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt             --ignore-vuln PYSEC-2026-311             --ignore-vuln PYSEC-2026-3813             --ignore-vuln PYSEC-2026-3814             --ignore-vuln PYSEC-2026-3815
