name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # ChromaDB is a transitive CrewAI dependency. These specific advisories
      # currently have no patched upstream release. Keep exceptions explicit
      # and remove them as soon as fixed releases become available.
      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt             --ignore-vuln PYSEC-2026-311             --ignore-vuln PYSEC-2026-3813             --ignore-vuln PYSEC-2026-3814             --ignore-vuln PYSEC-2026-3815
