name: CI
on:
  push:
    branches: [main, expert-production-upgrade, feat/ai-evaluation-evidence-pipeline]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest -q
      - name: AI content evaluation benchmark
        run: python -m evaluation.run_evaluation evaluation/fixtures/sample_article.md --verification evaluation/fixtures/sample_verification.json --minimum-score 0.80
